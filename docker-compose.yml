services:
  start-site:
    build: .
    image: start-spring-io-china:local
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SERVER_PORT: "8080"
      APPLICATION_OFFLINE: "${APPLICATION_OFFLINE:-true}"
      JAVA_OPTS: "${JAVA_OPTS:--XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0}"
